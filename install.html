<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Sparepart USK - Aplikasi Mobile</title>
    <meta name="theme-color" content="#e63946">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: #1a1a2e; color: #fff; min-height: 100vh; }
        .install-page { max-width: 500px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .app-icon { width: 120px; height: 120px; border-radius: 24px; margin: 0 auto 20px; background: #e63946; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 0 10px 30px rgba(230,57,70,0.4); }
        .app-name { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .app-desc { color: #aaa; margin-bottom: 30px; }
        .install-btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: transform 0.2s; }
        .install-btn:active { transform: scale(0.97); }
        .btn-primary-big { background: #e63946; color: #fff; }
        .btn-secondary-big { background: #333; color: #fff; border: 1px solid #555; }
        .steps { text-align: left; background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .steps h3 { margin-bottom: 15px; color: #e63946; }
        .step { display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-start; }
        .step-num { background: #e63946; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .step-text { color: #ccc; line-height: 1.5; }
        .browser-badge { display: inline-block; background: #333; padding: 4px 12px; border-radius: 20px; font-size: 12px; color: #aaa; margin-bottom: 20px; }
        .feature-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .feature-item { background: #16213e; padding: 12px; border-radius: 8px; font-size: 13px; color: #ccc; }
        .feature-item span { font-size: 20px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="install-page">
        <div class="app-icon">&#128295;</div>
        <div class="app-name">Sparepart USK</div>
        <div class="app-desc">Toko Sparepart Otomotif Online</div>

        <div id="browserInfo" class="browser-badge"></div>

        <div class="feature-list">
            <div class="feature-item"><span>&#128722;</span> Belanja Mudah</div>
            <div class="feature-item"><span>&#128196;</span> Riwayat Order</div>
            <div class="feature-item"><span>&#128270;</span> Cari Produk</div>
            <div class="feature-item"><span>&#128640;</span> Cepat & Ringan</div>
        </div>

        <button class="install-btn btn-primary-big" id="installBtn" onclick="doInstall()">
            &#128229; Install Sekarang
        </button>

        <a href="https://sparepart-usk.vercel.app" class="install-btn btn-secondary-big" style="text-decoration:none;display:block;">
            &#127760; Buka di Browser
        </a>

        <div class="steps" id="manualSteps"></div>
    </div>

    <script>
        var deferredPrompt = null;
        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        var isChrome = /Chrome/i.test(navigator.userAgent) && !/Edge/i.test(navigator.userAgent);
        var isSafari = /^((?!Chrome|Android).)*Safari/i.test(navigator.userAgent);
        var isMobile = isAndroid || isIOS;

        // Browser info
        var info = document.getElementById('browserInfo');
        if (isAndroid && isChrome) info.textContent = 'Android + Chrome (Terbaik)';
        else if (isAndroid) info.textContent = 'Android';
        else if (isIOS) info.textContent = 'iPhone / iPad';
        else info.textContent = 'Desktop';

        // Listen for PWA install prompt
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
        });

        function doInstall() {
            if (deferredPrompt) {
                // PWA install available - trigger it
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(result) {
                    if (result.outcome === 'accepted') {
                        document.getElementById('installBtn').textContent = '✅ Berhasil Diinstall!';
                        document.getElementById('installBtn').style.background = '#28a745';
                    }
                    deferredPrompt = null;
                });
            } else {
                // Show manual instructions
                showManualInstall();
            }
        }

        function showManualInstall() {
            var stepsDiv = document.getElementById('manualSteps');
            var html = '';

            if (isAndroid && isChrome) {
                html = '<h3>&#128241; Cara Install di Android Chrome</h3>' +
                    '<div class="step"><div class="step-num">1</div><div class="step-text">Klik tombol <strong>⋮ (3 titik)</strong> di pojok kanan atas browser</div></div>' +
                    '<div class="step"><div class="step-num">2</div><div class="step-text">Pilih menu <strong>"Install app"</strong> atau <strong>"Tambahkan ke beranda"</strong></div></div>' +
                    '<div class="step"><div class="step-num">3</div><div class="step-text">Klik <strong>"Install"</strong> atau <strong>"Tambahkan"</strong></div></div>' +
                    '<div class="step"><div class="step-num">&#10004;</div><div class="step-text">Aplikasi sudah terinstall di HP Anda!</div></div>';
            } else if (isAndroid) {
                html = '<h3>&#128241; Cara Install di Android</h3>' +
                    '<div class="step"><div class="step-num">1</div><div class="step-text">Buka website ini di <strong>Google Chrome</strong></div></div>' +
                    '<div class="step"><div class="step-num">2</div><div class="step-text">Klik tombol <strong>⋮ (3 titik)</strong> di pojok kanan atas</div></div>' +
                    '<div class="step"><div class="step-num">3</div><div class="step-text">Pilih <strong>"Install app"</strong> atau <strong>"Tambahkan ke beranda"</strong></div></div>' +
                    '<div class="step"><div class="step-num">4</div><div class="step-text">Klik <strong>"Install"</strong></div></div>' +
                    '<div class="step"><div class="step-num">&#10004;</div><div class="step-text">Selesai! Aplikasi ada di home screen</div></div>';
            } else if (isIOS) {
                html = '<h3>&#128241; Cara Install di iPhone/iPad</h3>' +
                    '<div class="step"><div class="step-num">1</div><div class="step-text">Buka website ini di <strong>Safari</strong></div></div>' +
                    '<div class="step"><div class="step-num">2</div><div class="step-text">Klik tombol <strong>Share &#128228;</strong> (kotak dengan panah) di bawah</div></div>' +
                    '<div class="step"><div class="step-num">3</div><div class="step-text">Pilih <strong>"Add to Home Screen"</strong> atau <strong>"Tambah ke Layar Utama"</strong></div></div>' +
                    '<div class="step"><div class="step-num">4</div><div class="step-text">Klik <strong>"Add"</strong> di pojok kanan atas</div></div>' +
                    '<div class="step"><div class="step-num">&#10004;</div><div class="step-text">Aplikasi sudah ada di home screen!</div></div>';
            } else {
                html = '<h3>&#128187; Cara Install di Desktop</h3>' +
                    '<div class="step"><div class="step-num">1</div><div class="step-text">Lihat ikon <strong>Install</strong> atau <strong>+</strong> di address bar (pojok kanan)</div></div>' +
                    '<div class="step"><div class="step-num">2</div><div class="step-text">Klik ikon tersebut untuk install</div></div>' +
                    '<div class="step"><div class="step-num">3</div><div class="step-text">Atau klik <strong>⋮ menu</strong> > <strong>"Install Sparepart USK"</strong></div></div>' +
                    '<div class="step"><div class="step-num">&#10004;</div><div class="step-text">Aplikasi akan muncul di desktop/start menu</div></div>';
            }

            stepsDiv.innerHTML = html;
            stepsDiv.style.display = 'block';
        }

        // Show manual steps after 3 seconds if no PWA prompt
        setTimeout(function() {
            if (!deferredPrompt) {
                showManualInstall();
            }
        }, 3000);
    </script>
</body>
</html>
