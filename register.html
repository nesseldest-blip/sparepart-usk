<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sparepart USK</title>
    <meta name="description" content="Buat akun baru Sparepart USK">
    <meta name="theme-color" content="#e63946">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon">🔧</span>
                <span class="brand-text">Sparepart <strong>USK</strong></span>
            </a>
            <div class="navbar-menu" id="navbarMenu">
                <a href="index.html">Beranda</a>
                <a href="products.html">Produk</a>
                <a href="cart.html">🛒 Keranjang</a>
                <div id="authLinks">
                    <a href="login.html">Login</a>
                    <a href="register.html" class="btn btn-primary btn-sm active">Daftar</a>
                </div>
                <div id="userLinks" style="display:none;">
                    <a href="orders.html">Pesanan Saya</a>
                    <a href="#" onclick="App.logout()" class="btn btn-danger btn-sm">Logout</a>
                </div>
            </div>
            <button class="navbar-toggle" id="navbarToggle">☰</button>
        </div>
    </nav>

    <!-- Auth Body -->
    <div class="auth-body">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">🔧</div>
                    <h1>Daftar Akun</h1>
                    <p>Buat akun baru untuk berbelanja</p>
                </div>

                <div id="alertBox" style="display:none;"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Masukkan email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password (min. 6 karakter)" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="no_hp">No. Handphone</label>
                        <input type="tel" id="no_hp" name="no_hp" class="form-control" placeholder="Masukkan no. handphone" required>
                    </div>
                    <div class="form-group">
                        <label for="alamat">Alamat</label>
                        <textarea id="alamat" name="alamat" class="form-control" rows="3" placeholder="Masukkan alamat lengkap" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
                </form>

                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
                    <p><a href="index.html">← Kembali ke beranda</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Sparepart USK. Tugas USK Rekayasa Perangkat Lunak.</p>
    </footer>

    <script src="assets/js/app.js"></script>
    <script>
        function showAlert(message, type) {
            var alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert alert-' + type;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function updateAuthLinks() {
            if (App.isLoggedIn()) {
                document.getElementById('authLinks').style.display = 'none';
                document.getElementById('userLinks').style.display = 'flex';
            } else {
                document.getElementById('authLinks').style.display = 'flex';
                document.getElementById('userLinks').style.display = 'none';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var nama = document.getElementById('nama').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var no_hp = document.getElementById('no_hp').value.trim();
            var alamat = document.getElementById('alamat').value.trim();

            if (!nama || !email || !password || !no_hp || !alamat) {
                showAlert('Semua field harus diisi!', 'danger');
                return;
            }

            if (password.length < 6) {
                showAlert('Password minimal 6 karakter!', 'danger');
                return;
            }

            var result = App.register(nama, email, password, no_hp, alamat);
            if (result.success) {
                showAlert(result.message + ' Mengalihkan ke halaman login...', 'success');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                showAlert(result.message, 'danger');
            }
        });

        // Mobile toggle
        document.getElementById('navbarToggle').addEventListener('click', function() {
            document.getElementById('navbarMenu').classList.toggle('active');
            this.textContent = document.getElementById('navbarMenu').classList.contains('active') ? '✕' : '☰';
        });

        updateAuthLinks();
    </script>
</body>
</html>
